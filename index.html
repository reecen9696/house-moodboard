<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moodboard">
  <title>House Moodboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 id="title">Photos</h1>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="menuBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
      </div>
    </header>
    <div class="search" id="searchBar" hidden>
      <input id="searchInput" type="search" placeholder="Search: black tapware, timber, federation…" autocomplete="off">
    </div>
    <div id="banner"></div>
    <div class="toolbar" id="toolbar">
      <div class="chips" id="chips"></div>
      <div class="toolrow">
        <div class="seg" id="groupSeg" role="tablist" aria-label="Group by">
          <button data-group="date">Date</button><button data-group="property">Source</button><button data-group="room">Room</button>
        </div>
        <button class="text-btn" id="selectBtn">Select</button>
      </div>
    </div>
    <main id="main"><div id="view"></div></main>

    <button class="fab" id="fab" aria-label="Add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <nav class="tabs" id="tabs">
      <button data-view="photos">Photos</button>
      <button data-view="houses">Houses</button>
      <button data-view="ideas">Ideas</button>
      <button data-view="rooms">Rooms</button>
    </nav>
    <div class="selectbar" id="selectBar" hidden>
      <button class="text-btn" data-b="cancel">Cancel</button>
      <b id="selCount">0 selected</b>
      <div class="sel-actions">
        <label class="pill sel-room">Room<select data-b="room"></select></label>
        <button class="pill" data-b="fav" aria-label="Favourite">♥</button>
        <button class="pill danger" data-b="delete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <section class="viewer" id="viewer" hidden></section>
  <section class="login" id="login" hidden></section>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
