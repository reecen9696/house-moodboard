<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moodboard">
  <title>House Moodboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"><div id="view"></div></main>
  <nav class="nav" id="nav"></nav>

  <div class="toast" id="toast" hidden></div>
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <section class="viewer" id="viewer" hidden></section>
  <section class="login" id="login" hidden></section>
  <input type="file" id="files" accept="image/*" multiple hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
